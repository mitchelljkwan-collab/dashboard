<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All done — thank you!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .box {
      max-width: 480px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 14px;
    }

    p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
    }

    p + p {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✓</div>
    <h1>That's all done — thank you!</h1>
    <p>
      Mitchell's got your response and will take it into account when planning.
    </p>
    <p>
      You don't need to do anything else. He'll be in touch once he has a clearer picture
      of what works for everyone.
    </p>
  </div>
</body>
</html>
